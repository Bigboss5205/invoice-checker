# =============================================================================
#  发票批量查验 —— 配置（可选）
#
#  把本文件改名为 config.yaml，放到「发票查验.exe」旁边即可生效。
#  **没有这个文件程序也能跑**：默认就查程序自己所在的目录。
#
#  改完保存，程序每次开始查验时会重新读取，不用重装。
#  最常需要动的只有两处：
#    1) paths.workdir             —— 发票不在程序目录时指过去
#    2) verify.min_interval_seconds —— 查验间隔（平台有频率风控，别调太小）
# =============================================================================

paths:
  # 发票所在目录。"." 表示程序所在目录。也可以用绝对路径。
  workdir: "."
  db: "发票查验记录.sqlite3"      # 查验历史（SQLite）
  log: "发票查验日志.txt"          # 出问题先看这个

scan:
  extensions: [".pdf", ".ofd", ".xml", ".png", ".jpg", ".jpeg", ".bmp", ".webp", ".tif", ".tiff"]
  recursive: false          # 是否连子目录一起查
  skip_verified: true       # 已有「-已查验」结果的就跳过，重复运行不会白跑
  stable_seconds: 1

output:
  suffix: "-已查验"          # 结果命名：<原文件名>-已查验.pdf
  pdf: true                 # 导出查验结果 PDF
  overwrite: true           # 同名结果已存在时覆盖（false 则自动加 _2 _3）
  record_txt: false         # 额外存一份纯文本记录
  subfolder: ""             # 结果另存到子目录，例如 "已查验"；留空=与原发票同目录

extract:
  densify_digits: true      # 发票上数字常被排版插空格，先拼回去再识别
  render_dpi: 220           # PDF 没有文本层时，渲染成图片的清晰度
  image_ocr: true           # 图片类发票是否尝试 OCR
  save_debug_text: false    # 把识别到的原始文本存到「发票查验出错现场」目录

captcha:
  # 默认「全部人工输入」——平台验证码是「挑出指定颜色的字符」且中英混排，
  # 自动识别成功率很低，与其每张白等几轮重试，不如直接弹窗照着图敲。
  # 注意：验证码**位数不固定**（取决于图里指定颜色的字符有几个），
  # 输入框不会按长度自动提交，敲完按回车或点「提交」。
  # 想试试自动识别就改成 true（认不出仍会转人工，不会卡住）。
  auto_ocr: false
  max_auto_attempts: 6      # 仅在 auto_ocr: true 时有意义
  manual_timeout_seconds: 180
  manual_max_rounds: 3      # 人工最多被问几次（点「跳过」会换一张再问）

verify:
  enabled: true
  driver: playwright        # playwright=真实查验；fake=离线演练（结果全是模拟的）
  headless: true            # false 会弹出真实浏览器窗口（想亲眼看平台页面时用）
  browser_channel: msedge   # msedge | chrome | chromium | auto（按顺序自动尝试）
  nav_timeout_ms: 45000
  result_timeout_ms: 30000
  min_interval_seconds: 8   # 两张票之间最小间隔。平台有风控，不建议小于 5
  max_attempts: 2           # 同一张票整体重试次数
  stop_on_consecutive_failures: 0   # >0 时连续失败这么多次自动停下（0=不停）

ui:
  auto_start: false         # 打开程序就自动开始
  log_lines: 400

platform:
  # legacy = 旧版普通 HTML 页面（默认，稳定）；spa = 新版 Vue 单页应用
  #
  # 为什么默认用旧版：新版是 Vue SPA，实测它依赖的
  # assets_res/js/chunk-vendors.ccf6a1dc.js 在服务器上**并不存在**
  # （请求它返回 index.html，HTTP 状态还是 200）。浏览器把 HTML 当 JS 解析，
  # 报 "Unexpected token '<'"，Vue 从未挂载、整页空白——而且是间歇性的。
  # 这是平台自身的部署缺陷；旧版是普通表单，没有这个问题。
  mode: legacy
  home_url: "https://inv-veri.chinatax.gov.cn/index.html"
  spa_url: "https://inv-veri.chinatax.gov.cn/fpcygzfw/"

  # 旧版：元素都是页面上的原始 id
  #   注意「确定」是 input[type=button] 而不是 <button>，
  #   用 button:has-text('确定') 是选不中的。
  legacy_selectors:
    invoice_code:
      - "#fpdm"
    invoice_number:
      - "#fphm"
    invoice_date:
      - "#kprq"
    value_label:
      - "#context"          # 动态标签：开具金额(不含税) / 价税合计 / 校验码
    value_input:
      - "#kjje"
    captcha_input:
      - "#yzm"
    captcha_image:
      - "#yzm_img"
    captcha_refresh:
      - "text=点击图片刷新"
      - "#yzm_img"
    captcha_hint:
      - "#yzminfo"
      - "#yzm"
    submit:
      - "#checkfp"
      - "#uncheckfp"
    alert_message:
      - "#popup_message"
    alert_ok:
      - "#popup_ok"
      - "input[value*='确定']"

  # 新版 SPA 的选择器（只有 mode: spa 时用；平台改版后跑 scripts/discover.py 重抓）
  selectors:
    invoice_number:
      - ".t-form-item__fphm input"
    invoice_code:
      - ".t-form-item__fpdm input"
    invoice_date:
      - ".t-form-item__kprq input"
    value_item:
      - ".t-form-item__kpje"
      - ".t-form-item__kjh"
    value_input:
      - ".t-form-item__kpje input"
      - ".t-form-item__kjh input"
    value_label:
      - ".t-form__label"
    captcha_input:
      - ".t-form-item__yzm input"
    captcha_image:
      - "form.t-form img"
    captcha_refresh:
      - ".form-box-tip__yzm"
    captcha_hint:
      - ".yzm-tips"
      - ".form-box-tip"
    submit:
      - "button.t-button[type='submit']"
    alert_ok:
      - "#popup_ok"
      - ".t-dialog button"
    alert_message:
      - "#popup_message"
      - ".t-dialog__body"
    date_year_select:
      - ".t-date-picker__header-controller-year input"
    date_month_select:
      - ".t-date-picker__header-controller-month input"
    date_option:
      - ".t-select-option"
    date_cell:
      - ".t-date-picker__cell"
  # 平台返回文案 → 结论。匹配是「包含」关系，从上往下第一个命中生效。
  # 结论优先取自 queryFpcyxx 接口返回的 CyjgMsg（更早更准），页面文本兜底。
  result_keywords:
    captcha_wrong: ["验证码错误", "验证码不正确", "验证码有误"]
    rate_limited: ["超过该张发票当日查验次数", "查验次数已达上限", "访问过于频繁"]
    not_found: ["查无此票", "未查到", "查验失败"]
    mismatch: ["不一致", "不符"]
    ok: ["查验成功", "查验一致", "信息一致"]
